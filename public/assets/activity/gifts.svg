<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <defs>
    <radialGradient id="burstGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="redEnv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="35%" stop-color="#ef4444" />
      <stop offset="80%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Golden Ray Burst -->
  <circle cx="120" cy="90" r="85" fill="url(#burstGlow)" />

  <!-- Left Red Envelope -->
  <g transform="translate(75, 100) rotate(-16)" filter="url(#shadow)">
    <rect x="-35" y="-50" width="70" height="100" rx="10" fill="url(#redEnv)" stroke="#b91c1c" stroke-width="1.5" />
    <!-- Flap Curve -->
    <path d="M -35 -50 Q 0 -20 35 -50 Z" fill="#b91c1c" />
    <!-- Golden Seal -->
    <circle cx="0" cy="-28" r="12" fill="url(#goldCoin)" stroke="#78350f" stroke-width="1.5" />
    <text x="0" y="-22" fill="#78350f" font-family="'Arial Black'" font-size="12" text-anchor="middle">福</text>
  </g>

  <!-- Right Red Envelope (Main) -->
  <g transform="translate(145, 95) rotate(12)" filter="url(#shadow)">
    <rect x="-42" y="-60" width="84" height="120" rx="12" fill="url(#redEnv)" stroke="#b91c1c" stroke-width="1.5" />
    <!-- Flap Curve -->
    <path d="M -42 -60 Q 0 -25 42 -60 Z" fill="#b91c1c" />
    <!-- Golden Seal -->
    <circle cx="0" cy="-35" r="14" fill="url(#goldCoin)" stroke="#78350f" stroke-width="1.5" />
    <text x="0" y="-28" fill="#78350f" font-family="'Arial Black'" font-size="14" text-anchor="middle">财</text>
  </g>

  <!-- Floating 3D Golden Coins -->
  <circle cx="120" cy="40" r="18" fill="url(#goldCoin)" stroke="#ca8a04" stroke-width="2" filter="url(#shadow)" />
  <circle cx="65" cy="45" r="12" fill="url(#goldCoin)" stroke="#ca8a04" stroke-width="1.5" />
  <circle cx="180" cy="48" r="14" fill="url(#goldCoin)" stroke="#ca8a04" stroke-width="1.5" />
  <circle cx="115" cy="140" r="15" fill="url(#goldCoin)" stroke="#ca8a04" stroke-width="1.5" />
</svg>