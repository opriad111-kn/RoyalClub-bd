<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <defs>
    <radialGradient id="burstGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="calHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <circle cx="120" cy="90" r="85" fill="url(#burstGlow2)" />

  <!-- 3D Desk Calendar -->
  <g transform="translate(110, 95)" filter="url(#shadow)">
    <!-- Calendar Body -->
    <rect x="-55" y="-55" width="110" height="110" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <!-- Header Purple Bar -->
    <path d="M -55 -55 Q -55 -55 -41 -55 L 41 -55 Q 55 -55 55 -41 L 55 -25 L -55 -25 Z" fill="url(#calHeader)" />
    
    <!-- Spiral Rings on Top -->
    <rect x="-40" y="-62" width="6" height="14" rx="3" fill="#64748b" />
    <rect x="-15" y="-62" width="6" height="14" rx="3" fill="#64748b" />
    <rect x="10" y="-62" width="6" height="14" rx="3" fill="#64748b" />
    <rect x="35" y="-62" width="6" height="14" rx="3" fill="#64748b" />

    <!-- Calendar Grid Checkmark -->
    <g transform="translate(0, 10)">
      <circle cx="0" cy="0" r="24" fill="#10b981" />
      <path d="M -12 0 L -4 8 L 12 -8" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Yellow Pencil on Angle -->
  <g transform="translate(175, 80) rotate(35)" filter="url(#shadow)">
    <!-- Pencil Body -->
    <polygon points="-8,-40 8,-40 8,35 -8,35" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" />
    <!-- Pencil Tip -->
    <polygon points="-8,35 8,35 0,55" fill="#fed7aa" stroke="#ca8a04" stroke-width="1.5" />
    <polygon points="-3,48 3,48 0,55" fill="#1e293b" />
    <!-- Eraser -->
    <rect x="-8" y="-50" width="16" height="10" rx="2" fill="#f43f5e" />
    <rect x="-8" y="-43" width="16" height="4" fill="#cbd5e1" />
  </g>

  <!-- Golden Reward Coins -->
  <circle cx="55" cy="50" r="14" fill="url(#goldCoin)" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)" />
  <circle cx="175" cy="140" r="16" fill="url(#goldCoin)" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)" />
</svg>