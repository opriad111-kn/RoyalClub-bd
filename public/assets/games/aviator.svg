<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <radialGradient id="sunFlare" cx="30%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#fef08a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="planeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="redStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <filter id="planeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0369a1" flood-opacity="0.5" />
    </filter>
    <filter id="textGlow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="400" height="320" rx="24" fill="url(#skyGrad)" />
  <rect width="400" height="320" rx="24" fill="url(#sunFlare)" />

  <!-- Fluffy 3D Clouds -->
  <g fill="#ffffff" opacity="0.6" filter="blur(3px)">
    <ellipse cx="60" cy="90" rx="55" ry="32" />
    <ellipse cx="110" cy="80" rx="45" ry="28" />
    <ellipse cx="330" cy="140" rx="65" ry="38" />
    <ellipse cx="370" cy="150" rx="50" ry="32" />
  </g>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="75" cy="85" rx="42" ry="24" />
    <ellipse cx="340" cy="135" rx="52" ry="28" />
    <ellipse cx="25" cy="220" rx="60" ry="28" />
  </g>

  <!-- Speed Trail -->
  <path d="M -10 260 C 110 230, 200 170, 310 120" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-dasharray="10 8" opacity="0.9" />
  <path d="M 10 280 C 120 250, 220 190, 320 135" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 6" opacity="0.75" />

  <!-- SPRIBE Provider Badge -->
  <rect x="306" y="14" width="78" height="26" rx="8" fill="#0f172a" opacity="0.85" />
  <text x="345" y="32" fill="#38bdf8" font-family="Arial, sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1">SPRIBE</text>

  <!-- Airplane Body -->
  <g transform="translate(195, 125) rotate(-16) scale(1.15)" filter="url(#planeShadow)">
    <!-- Back Wing -->
    <path d="M -10 -15 L 20 -60 L 45 -55 L 15 -10 Z" fill="url(#wingGrad)" stroke="#b45309" stroke-width="2" />
    <path d="M 20 -60 L 45 -55 L 43 -48 L 22 -52 Z" fill="url(#redStripe)" />

    <!-- Tail Fin (Rudder) -->
    <path d="M -75 -5 L -95 -45 L -72 -42 L -60 -5 Z" fill="url(#planeBody)" stroke="#92400e" stroke-width="2" />
    <path d="M -95 -45 L -72 -42 L -74 -34 L -93 -37 Z" fill="url(#redStripe)" />
    <!-- Horizontal Stabilizer -->
    <ellipse cx="-75" cy="-3" rx="22" ry="6" fill="#d97706" />

    <!-- Fuselage (Main Body) -->
    <ellipse cx="0" cy="0" rx="82" ry="24" fill="url(#planeBody)" stroke="#78350f" stroke-width="2.5" />

    <!-- Red Racing Stripes on Fuselage -->
    <path d="M -60 2 L 50 2 L 45 11 L -55 11 Z" fill="url(#redStripe)" />
    <circle cx="-20" cy="-1" r="5" fill="#ffffff" />
    <circle cx="5" cy="-1" r="5" fill="#ffffff" />

    <!-- Cockpit Canopy Glass -->
    <path d="M -18 -18 Q 12 -25 32 -8 Q 10 -4 -18 -8 Z" fill="#0284c7" stroke="#e0f2fe" stroke-width="2" />
    <path d="M -10 -16 Q 10 -21 24 -10" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85" />

    <!-- Front Wing (Foreground) -->
    <path d="M -25 5 L -10 65 L 25 60 L 15 5 Z" fill="url(#planeBody)" stroke="#78350f" stroke-width="2.5" />
    <path d="M -10 65 L 25 60 L 22 52 L -8 57 Z" fill="url(#redStripe)" />

    <!-- Nose Cone / Spinner -->
    <path d="M 75 -12 Q 95 0 75 12 Z" fill="url(#redStripe)" stroke="#7f1d1d" stroke-width="1.5" />

    <!-- Spinning Propeller Blades with Motion Blur -->
    <ellipse cx="86" cy="0" rx="4" ry="44" fill="#ffffff" opacity="0.6" />
    <ellipse cx="86" cy="0" rx="45" ry="4" fill="#ffffff" opacity="0.45" />
    <circle cx="84" cy="0" r="7" fill="#f59e0b" stroke="#78350f" stroke-width="1.5" />
  </g>

  <!-- Big Bold 3D AVIATOR Text -->
  <g filter="url(#textGlow)">
    <text x="200" y="285" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="3">AVIATOR</text>
  </g>
</svg>