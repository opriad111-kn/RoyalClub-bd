<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <radialGradient id="trxBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="60%" stop-color="#1c0505" />
      <stop offset="100%" stop-color="#0a0202" />
    </radialGradient>
    <linearGradient id="trxRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="tronDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <radialGradient id="ballRed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fecdd3" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="85%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </radialGradient>
    <radialGradient id="ballViolet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="85%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#581c87" />
    </radialGradient>
    <radialGradient id="ballGreen" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="85%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.8" />
    </filter>
  </defs>

  <rect width="400" height="320" rx="24" fill="url(#trxBg)" />

  <!-- Blockchain Grid Pattern -->
  <g opacity="0.15" stroke="#ef4444" stroke-width="1.5">
    <line x1="50" y1="40" x2="350" y2="40" />
    <line x1="50" y1="120" x2="350" y2="120" />
    <line x1="50" y1="200" x2="350" y2="200" />
    <line x1="100" y1="20" x2="100" y2="240" />
    <line x1="200" y1="20" x2="200" y2="240" />
    <line x1="300" y1="20" x2="300" y2="240" />
  </g>

  <!-- Tron TRX Geometric Emblem in Background -->
  <g transform="translate(200, 110)" filter="url(#shadow)">
    <polygon points="0,-70 55,25 0,10 -55,25" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.4" />
    <polygon points="0,-45 35,20 0,5 -35,20" fill="url(#tronDiamond)" opacity="0.25" />
  </g>

  <!-- Left Green Ball (1) -->
  <g transform="translate(100, 140)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="34" fill="url(#ballGreen)" />
    <circle cx="0" cy="0" r="16" fill="#ffffff" />
    <text x="0" y="7" font-family="'Arial Black'" font-size="20" font-weight="900" fill="#000" text-anchor="middle">1</text>
  </g>

  <!-- Center Violet/Red Split Ball (0) -->
  <g transform="translate(200, 95)" filter="url(#shadow)">
    <clipPath id="splitClipLeft">
      <rect x="-44" y="-44" width="44" height="88" />
    </clipPath>
    <clipPath id="splitClipRight">
      <rect x="0" y="-44" width="44" height="88" />
    </clipPath>
    <!-- Left Violet Half -->
    <circle cx="0" cy="0" r="44" fill="url(#ballViolet)" clip-path="url(#splitClipLeft)" />
    <!-- Right Red Half -->
    <circle cx="0" cy="0" r="44" fill="url(#ballRed)" clip-path="url(#splitClipRight)" />
    <circle cx="0" cy="0" r="44" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
    <circle cx="0" cy="0" r="20" fill="#ffffff" />
    <text x="0" y="8" font-family="'Arial Black'" font-size="24" font-weight="900" fill="#000" text-anchor="middle">0</text>
  </g>

  <!-- Right Red Ball (6) -->
  <g transform="translate(300, 140)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="34" fill="url(#ballRed)" />
    <circle cx="0" cy="0" r="16" fill="#ffffff" />
    <text x="0" y="7" font-family="'Arial Black'" font-size="20" font-weight="900" fill="#000" text-anchor="middle">6</text>
  </g>

  <!-- TRX Blockchain Badge -->
  <g transform="translate(200, 190)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#000000" stroke="#ef4444" stroke-width="2" />
    <text x="0" y="5" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#ef4444" text-anchor="middle" letter-spacing="1.5">
      TRON BLOCKCHAIN
    </text>
  </g>

  <!-- Bottom Title Banner -->
  <g transform="translate(200, 260)">
    <text x="0" y="0" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      TRX WIN GO
    </text>
    <text x="0" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle">
      100% PROVABLY FAIR HASH
    </text>
  </g>
</svg>

