<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="mintBgTrx" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e8f8f0" />
      <stop offset="100%" stop-color="#cbf3dd" />
    </radialGradient>
    <linearGradient id="trxRedGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="trxRedGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="trxCoinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="trxDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#047857" flood-opacity="0.25" />
    </filter>
    <filter id="floorBlurTrx" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="200" height="200" rx="20" fill="url(#mintBgTrx)" />

  <!-- Diagonal subtle pattern stripes -->
  <path d="M-20,60 L120,-80 M-20,120 L180,-80 M-20,180 L240,-80 M40,220 L260,0 M100,240 L280,60" 
        stroke="#10b981" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Floor Shadow -->
  <ellipse cx="120" cy="165" rx="42" ry="10" fill="#047857" opacity="0.25" filter="url(#floorBlurTrx)" />
  <ellipse cx="65" cy="160" rx="22" ry="7" fill="#047857" opacity="0.2" filter="url(#floorBlurTrx)" />

  <!-- 3D Tron Red Diamond/Crystal -->
  <g transform="translate(100, 60)" filter="url(#trxDrop)">
    <!-- Top Face -->
    <path d="M25,0 L65,40 L-10,35 Z" fill="#fca5a5" />
    <!-- Center Left Facet -->
    <path d="M-10,35 L25,0 L-5,65 Z" fill="#ef4444" />
    <!-- Center Main Facet -->
    <path d="M-5,65 L25,0 L35,75 Z" fill="#dc2626" />
    <!-- Center Right Facet -->
    <path d="M35,75 L25,0 L65,40 Z" fill="#b91c1c" />
    <!-- Bottom Point Left -->
    <path d="M-5,65 L18,100 L35,75 Z" fill="#991b1b" />
    <!-- White Tron Inner Line -->
    <path d="M25,12 L32,65 M25,12 L5,55" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Gold/Orange Coin Bottom Left -->
  <g transform="translate(40, 115)" filter="url(#trxDrop)">
    <circle cx="25" cy="25" r="22" fill="url(#trxCoinGrad)" stroke="#fef08a" stroke-width="1.5" />
    <circle cx="25" cy="25" r="17" fill="none" stroke="#a16207" stroke-width="1" stroke-dasharray="3 2" />
    <!-- TRON Logo "T" on Coin -->
    <path d="M17,17 L33,17 M25,17 L25,33 M20,23 L30,23" stroke="#854d0e" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
