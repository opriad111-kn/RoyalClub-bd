<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="jungleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="60%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="templeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#jungleBg)" />
  <circle cx="200" cy="130" r="140" fill="url(#portalGlow)" />

  <!-- Tropical Vines and Leaves -->
  <path d="M0,0 Q80,100 30,220 L0,220 Z" fill="#047857" opacity="0.6" />
  <path d="M400,0 Q320,100 370,220 L400,220 Z" fill="#047857" opacity="0.6" />

  <!-- Ancient Pyramid Temple -->
  <polygon points="200,60 270,180 130,180" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <polygon points="200,75 250,180 150,180" fill="#334155" />
  <!-- Steps -->
  <rect x="175" y="100" width="50" height="8" fill="#cbd5e1" />
  <rect x="170" y="115" width="60" height="8" fill="#cbd5e1" />
  <rect x="165" y="130" width="70" height="8" fill="#cbd5e1" />
  <rect x="160" y="145" width="80" height="8" fill="#cbd5e1" />
  <rect x="155" y="160" width="90" height="8" fill="#cbd5e1" />

  <!-- Temple Sanctuary Chamber with Glowing Gem -->
  <rect x="185" y="75" width="30" height="35" rx="3" fill="#0f172a" stroke="#eab308" stroke-width="2" />
  <polygon points="200,82 210,95 200,105 190,95" fill="#10b981" stroke="#a7f3d0" stroke-width="1.5" />

  <!-- Huge Glowing Emerald and Ruby on Sides -->
  <polygon points="90,130 115,100 140,130 115,160" fill="#10b981" stroke="#6ee7b7" stroke-width="3" />
  <polygon points="310,130 285,100 260,130 285,160" fill="#ef4444" stroke="#fca5a5" stroke-width="3" />

  <!-- Giant Golden 3 in Center Background -->
  <text x="200" y="215" font-family="Arial, sans-serif" font-weight="900" font-size="70" fill="url(#templeGold)" text-anchor="middle" opacity="0.9" stroke="#78350f" stroke-width="2">3</text>

  <!-- Title Ribbon -->
  <rect x="30" y="240" width="340" height="48" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2" />
  <text x="200" y="272" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#6ee7b7" text-anchor="middle" letter-spacing="2">FORTUNE GEMS 3</text>
</svg>