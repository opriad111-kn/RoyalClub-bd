<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
    <defs>
      <linearGradient id="candyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ec4899"/>
        <stop offset="50%" stop-color="#a855f7"/>
        <stop offset="100%" stop-color="#3b82f6"/>
      </linearGradient>
      <linearGradient id="lollipop" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ef4444"/>
        <stop offset="50%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#ef4444"/>
      </linearGradient>
      <linearGradient id="bombGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#facc15"/>
        <stop offset="50%" stop-color="#f97316"/>
        <stop offset="100%" stop-color="#ef4444"/>
      </linearGradient>
    </defs>
    <rect width="320" height="320" rx="24" fill="url(#candyGrad)"/>
    <!-- Swirled Lollipop -->
    <g transform="translate(90, 45)">
      <line x1="70" y1="90" x2="70" y2="160" stroke="#f1f5f9" stroke-width="10" stroke-linecap="round"/>
      <circle cx="70" cy="70" r="55" fill="url(#lollipop)" stroke="#fff" stroke-width="4"/>
      <path d="M40 70 A30 30 0 0 1 100 70 A15 15 0 0 1 70 70" fill="none" stroke="#ef4444" stroke-width="8"/>
    </g>
    <!-- 100X Multiplier Candy Bomb -->
    <g transform="translate(205, 115)">
      <circle cx="35" cy="35" r="32" fill="url(#bombGrad)" stroke="#fff" stroke-width="3"/>
      <text x="35" y="43" font-family="Arial Black, Impact" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">100X</text>
    </g>
    <!-- Little Candies -->
    <circle cx="50" cy="90" r="16" fill="#10b981" stroke="#fff" stroke-width="2"/>
    <polygon points="50,150 65,170 35,170" fill="#8b5cf6" stroke="#fff" stroke-width="2"/>
    <!-- Title Banner -->
    <g transform="translate(15, 230)">
      <rect width="290" height="70" rx="14" fill="#09090b" opacity="0.92" stroke="#f472b6" stroke-width="2"/>
      <text x="145" y="30" font-family="Arial Black, Impact, sans-serif" font-size="20" font-weight="900" fill="#f472b6" text-anchor="middle" letter-spacing="1">SWEET BONANZA</text>
      <text x="145" y="52" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fde047" text-anchor="middle" letter-spacing="2">PRAGMATIC PLAY • RTP 96.48%</text>
    </g>
  </svg>