<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
    <defs>
      <linearGradient id="evoBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0f172a"/>
        <stop offset="50%" stop-color="#1e1b4b"/>
        <stop offset="100%" stop-color="#311042"/>
      </linearGradient>
      <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="50%" stop-color="#eab308"/>
        <stop offset="100%" stop-color="#a16207"/>
      </linearGradient>
    </defs>
    <rect width="320" height="320" rx="24" fill="url(#evoBg)"/>
    <!-- Giant Studio Wheel -->
    <g transform="translate(160, 120)">
      <circle cx="0" cy="0" r="90" fill="#1e293b" stroke="url(#goldRibbon)" stroke-width="6"/>
      <!-- Wheel Segments -->
      <path d="M0 0 L-64 -64 A90 90 0 0 1 0 -90 Z" fill="#ef4444"/>
      <path d="M0 0 L0 -90 A90 90 0 0 1 64 -64 Z" fill="#3b82f6"/>
      <path d="M0 0 L64 -64 A90 90 0 0 1 90 0 Z" fill="#10b981"/>
      <path d="M0 0 L90 0 A90 90 0 0 1 64 64 Z" fill="#eab308"/>
      <path d="M0 0 L64 64 A90 90 0 0 1 0 90 Z" fill="#a855f7"/>
      <path d="M0 0 L0 90 A90 90 0 0 1 -64 64 Z" fill="#06b6d4"/>
      <path d="M0 0 L-64 64 A90 90 0 0 1 -90 0 Z" fill="#ec4899"/>
      <path d="M0 0 L-90 0 A90 90 0 0 1 -64 -64 Z" fill="#f97316"/>
      <!-- Center Wheel Hub -->
      <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="url(#goldRibbon)" stroke-width="4"/>
      <text x="0" y="7" font-family="Arial Black, Impact" font-size="12" font-weight="900" fill="#fef08a" text-anchor="middle">CRAZY</text>
      <!-- Top Pointer Flapper -->
      <polygon points="-8,-98 8,-98 0,-85" fill="#facc15" stroke="#000" stroke-width="1.5"/>
    </g>
    <!-- Title Banner -->
    <g transform="translate(15, 230)">
      <rect width="290" height="70" rx="14" fill="#09090b" opacity="0.94" stroke="url(#goldRibbon)" stroke-width="2"/>
      <text x="145" y="30" font-family="Arial Black, Impact, sans-serif" font-size="22" font-weight="900" fill="url(#goldRibbon)" text-anchor="middle" letter-spacing="2">CRAZY TIME</text>
      <text x="145" y="52" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">EVOLUTION • RTP 96.08%</text>
    </g>
  </svg>