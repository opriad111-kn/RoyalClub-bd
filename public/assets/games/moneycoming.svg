<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <radialGradient id="moneyBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="55%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#01140e" />
    </radialGradient>
    <linearGradient id="billGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="30%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="textGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="cashGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#10b981" flood-opacity="0.8" />
    </filter>
    <filter id="goldGlow2">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#fbbf24" flood-opacity="0.9" />
    </filter>
  </defs>

  <rect width="400" height="320" rx="24" fill="url(#moneyBg)" />

  <!-- JILI Badge -->
  <rect x="320" y="14" width="64" height="26" rx="8" fill="#e11d48" />
  <text x="352" y="32" fill="#ffffff" font-family="'Arial Black', sans-serif" font-weight="900" font-size="13" text-anchor="middle">JILI</text>

  <!-- Green Radial Energy Rays -->
  <g opacity="0.4" stroke="#34d399" stroke-width="2">
    <line x1="200" y1="125" x2="20" y2="20" />
    <line x1="200" y1="125" x2="380" y2="20" />
    <line x1="200" y1="125" x2="10" y2="125" />
    <line x1="200" y1="125" x2="390" y2="125" />
    <line x1="200" y1="125" x2="50" y2="260" />
    <line x1="200" y1="125" x2="350" y2="260" />
  </g>

  <!-- Fan of $100 Stacks -->
  <!-- Left Bill -->
  <g transform="translate(140, 115) rotate(-25)" filter="url(#cashGlow)">
    <rect x="-65" y="-35" width="130" height="70" rx="8" fill="url(#billGreen)" stroke="#a7f3d0" stroke-width="2" />
    <circle cx="0" cy="0" r="18" fill="#047857" stroke="#6ee7b7" stroke-width="1.5" />
    <text x="0" y="7" fill="#fff" font-family="'Arial Black'" font-size="20" font-weight="900" text-anchor="middle">$</text>
    <text x="-48" y="-18" fill="#ecfdf5" font-family="Arial" font-size="12" font-weight="bold">100</text>
    <text x="30" y="24" fill="#ecfdf5" font-family="Arial" font-size="12" font-weight="bold">100</text>
  </g>
  <!-- Right Bill -->
  <g transform="translate(260, 115) rotate(25)" filter="url(#cashGlow)">
    <rect x="-65" y="-35" width="130" height="70" rx="8" fill="url(#billGreen)" stroke="#a7f3d0" stroke-width="2" />
    <circle cx="0" cy="0" r="18" fill="#047857" stroke="#6ee7b7" stroke-width="1.5" />
    <text x="0" y="7" fill="#fff" font-family="'Arial Black'" font-size="20" font-weight="900" text-anchor="middle">$</text>
    <text x="-48" y="-18" fill="#ecfdf5" font-family="Arial" font-size="12" font-weight="bold">100</text>
    <text x="30" y="24" fill="#ecfdf5" font-family="Arial" font-size="12" font-weight="bold">100</text>
  </g>

  <!-- Giant 3D Golden Dollar Coin Center -->
  <g transform="translate(200, 125)" filter="url(#goldGlow2)">
    <circle cx="0" cy="0" r="54" fill="url(#goldCoin)" stroke="#78350f" stroke-width="3" />
    <circle cx="0" cy="0" r="44" fill="none" stroke="#fef08a" stroke-width="3" stroke-dasharray="8 6" />
    <text x="0" y="22" fill="#78350f" font-family="'Arial Black', Impact" font-size="64" font-weight="900" text-anchor="middle">$</text>
    <text x="-2" y="20" fill="#fffbeb" font-family="'Arial Black', Impact" font-size="64" font-weight="900" text-anchor="middle">$</text>
  </g>

  <!-- Flying Mini Gold Coins -->
  <circle cx="70" cy="60" r="14" fill="url(#goldCoin)" stroke="#ca8a04" stroke-width="1.5" />
  <circle cx="330" cy="70" r="12" fill="url(#goldCoin)" stroke="#ca8a04" stroke-width="1.5" />
  <circle cx="60" cy="200" r="16" fill="url(#goldCoin)" stroke="#ca8a04" stroke-width="1.5" />
  <circle cx="340" cy="190" r="15" fill="url(#goldCoin)" stroke="#ca8a04" stroke-width="1.5" />

  <!-- 3D MONEY COMING Typography -->
  <g filter="url(#goldGlow2)">
    <text x="200" y="260" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="30" font-weight="900" fill="url(#textGold)" stroke="#000" stroke-width="2">MONEY</text>
    <text x="200" y="296" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="34" font-weight="900" fill="#22c55e" stroke="#000" stroke-width="2.5">COMING</text>
  </g>
</svg>