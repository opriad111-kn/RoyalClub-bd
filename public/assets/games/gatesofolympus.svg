<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
    <defs>
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#311042"/>
        <stop offset="50%" stop-color="#4c1d95"/>
        <stop offset="100%" stop-color="#1e1b4b"/>
      </linearGradient>
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fffbeb"/>
        <stop offset="40%" stop-color="#fbbf24"/>
        <stop offset="100%" stop-color="#b45309"/>
      </linearGradient>
      <filter id="zeusGlow">
        <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.9"/>
      </filter>
    </defs>
    <rect width="320" height="320" rx="24" fill="url(#skyGrad)"/>
    <!-- Greek Columns -->
    <rect x="25" y="40" width="18" height="220" rx="4" fill="#cbd5e1" opacity="0.25"/>
    <rect x="277" y="40" width="18" height="220" rx="4" fill="#cbd5e1" opacity="0.25"/>
    <!-- Lightning Bolts -->
    <path d="M160 30 L175 110 L155 110 L180 180" fill="none" stroke="#67e8f9" stroke-width="4" filter="url(#zeusGlow)"/>
    <!-- Zeus Crown & Aura -->
    <circle cx="160" cy="130" r="55" fill="#f59e0b" opacity="0.15" filter="url(#zeusGlow)"/>
    <circle cx="160" cy="125" r="42" fill="#1e293b"/>
    <!-- Crown -->
    <polygon points="140,95 150,85 160,95 170,85 180,95 175,108 145,108" fill="url(#goldGrad)"/>
    <!-- Zeus Beard & Eyes -->
    <circle cx="150" cy="122" r="4" fill="#38bdf8" filter="url(#zeusGlow)"/>
    <circle cx="170" cy="122" r="4" fill="#38bdf8" filter="url(#zeusGlow)"/>
    <path d="M142 135 Q160 170 178 135" fill="#e2e8f0"/>
    <!-- 500X Multiplier Orb -->
    <g transform="translate(225, 60)">
      <circle cx="25" cy="25" r="24" fill="#0284c7" stroke="#38bdf8" stroke-width="2" filter="url(#zeusGlow)"/>
      <text x="25" y="32" font-family="Arial Black, Impact" font-size="15" font-weight="900" fill="#fff" text-anchor="middle">500X</text>
    </g>
    <!-- Title Banner -->
    <g transform="translate(15, 230)">
      <rect width="290" height="70" rx="14" fill="#09090b" opacity="0.9" stroke="url(#goldGrad)" stroke-width="2"/>
      <text x="145" y="30" font-family="Arial Black, Impact, sans-serif" font-size="19" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">GATES OF OLYMPUS</text>
      <text x="145" y="52" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">PRAGMATIC PLAY • RTP 96.50%</text>
    </g>
  </svg>