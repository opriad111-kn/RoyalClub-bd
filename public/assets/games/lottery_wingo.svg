<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Soft Mint Green Background -->
    <radialGradient id="mintBg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e8f8f0" />
      <stop offset="100%" stop-color="#cbf3dd" />
    </radialGradient>

    <!-- Green 9 Ball Gradient -->
    <radialGradient id="greenBall" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="35%" stop-color="#22c55e" />
      <stop offset="80%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </radialGradient>

    <!-- Red 4 Ball Gradient -->
    <radialGradient id="redBall" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="35%" stop-color="#ef4444" />
      <stop offset="80%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </radialGradient>

    <!-- Split Violet 0 Ball Gradient -->
    <radialGradient id="violetBall" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#581c87" />
    </radialGradient>

    <radialGradient id="ballGleam" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <filter id="ballShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#047857" flood-opacity="0.35" />
    </filter>
    <filter id="softFloorShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="200" height="200" rx="20" fill="url(#mintBg)" />

  <!-- Diagonal subtle pattern stripes -->
  <path d="M-20,60 L120,-80 M-20,120 L180,-80 M-20,180 L240,-80 M40,220 L260,0 M100,240 L280,60" 
        stroke="#10b981" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Floor Shadows -->
  <ellipse cx="115" cy="155" rx="55" ry="12" fill="#047857" opacity="0.18" filter="url(#softFloorShadow)" />
  <ellipse cx="60" cy="165" rx="28" ry="7" fill="#047857" opacity="0.22" filter="url(#softFloorShadow)" />
  <ellipse cx="130" cy="168" rx="26" ry="7" fill="#047857" opacity="0.22" filter="url(#softFloorShadow)" />

  <!-- 1. Green 9 Ball (Top Center-Right) -->
  <g filter="url(#ballShadow)">
    <circle cx="118" cy="85" r="38" fill="url(#greenBall)" />
    <!-- Ball Highlight -->
    <ellipse cx="106" cy="73" rx="14" ry="9" fill="url(#ballGleam)" transform="rotate(-20 106 73)" />
    <!-- White Number Ring Badge -->
    <circle cx="118" cy="85" r="18" fill="#ffffff" />
    <text x="118" y="93" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#15803d" text-anchor="middle">9</text>
  </g>

  <!-- 2. Red 4 Ball (Bottom Left) -->
  <g filter="url(#ballShadow)">
    <circle cx="62" cy="138" r="28" fill="url(#redBall)" />
    <!-- Highlight -->
    <ellipse cx="53" cy="129" rx="10" ry="6" fill="url(#ballGleam)" transform="rotate(-25 53 129)" />
    <!-- White Number Ring -->
    <circle cx="62" cy="138" r="13" fill="#ffffff" />
    <text x="62" y="144" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#b91c1c" text-anchor="middle">4</text>
  </g>

  <!-- 3. Violet 0 Ball (Bottom Right) -->
  <g filter="url(#ballShadow)">
    <circle cx="132" cy="142" r="26" fill="url(#violetBall)" />
    <!-- Highlight -->
    <ellipse cx="124" cy="133" rx="9" ry="5" fill="url(#ballGleam)" transform="rotate(-20 124 133)" />
    <!-- White Number Ring -->
    <circle cx="132" cy="142" r="12" fill="#ffffff" />
    <text x="132" y="147.5" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#6b21a8" text-anchor="middle">0</text>
  </g>
</svg>

