<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
    <defs>
      <linearGradient id="rouletteBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#020617"/>
        <stop offset="100%" stop-color="#1e1b4b"/>
      </linearGradient>
      <linearGradient id="voltGold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="100%" stop-color="#ca8a04"/>
      </linearGradient>
      <filter id="voltGlow">
        <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#eab308" flood-opacity="0.9"/>
      </filter>
    </defs>
    <rect width="320" height="320" rx="24" fill="url(#rouletteBg)"/>
    <!-- Roulette Wheel Outer -->
    <g transform="translate(160, 115)">
      <circle cx="0" cy="0" r="85" fill="#111827" stroke="url(#voltGold)" stroke-width="5"/>
      <circle cx="0" cy="0" r="60" fill="#1f2937" stroke="#374151" stroke-width="2"/>
      <!-- Lightning Strike -->
      <path d="M0 -105 L-15 -35 L10 -35 L-5 25 L35 -20 L10 -20 Z" fill="#facc15" stroke="#fff" stroke-width="2" filter="url(#voltGlow)"/>
      <!-- Numbers -->
      <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="url(#voltGold)" stroke-width="2"/>
      <text x="0" y="8" font-family="Arial Black" font-size="17" font-weight="900" fill="#facc15" text-anchor="middle">500X</text>
    </g>
    <!-- Title Banner -->
    <g transform="translate(15, 230)">
      <rect width="290" height="70" rx="14" fill="#09090b" opacity="0.94" stroke="url(#voltGold)" stroke-width="2"/>
      <text x="145" y="30" font-family="Arial Black, Impact, sans-serif" font-size="19" font-weight="900" fill="url(#voltGold)" text-anchor="middle" letter-spacing="1">LIGHTNING ROULETTE</text>
      <text x="145" y="52" font-family="sans-serif" font-size="11" font-weight="bold" fill="#facc15" text-anchor="middle" letter-spacing="2">EVOLUTION • RTP 97.30%</text>
    </g>
  </svg>