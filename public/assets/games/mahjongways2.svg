<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
    <defs>
      <linearGradient id="pgBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#064e3b"/>
        <stop offset="50%" stop-color="#022c22"/>
        <stop offset="100%" stop-color="#0f172a"/>
      </linearGradient>
      <linearGradient id="goldTile" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="100%" stop-color="#b45309"/>
      </linearGradient>
    </defs>
    <rect width="320" height="320" rx="24" fill="url(#pgBg)"/>
    <!-- 3D Golden Mahjong Tiles -->
    <g transform="translate(65, 55)">
      <!-- Tile 1 -->
      <rect x="0" y="10" width="80" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
      <rect x="5" y="15" width="70" height="100" rx="8" fill="#f1f5f9"/>
      <text x="40" y="75" font-family="SimHei, serif" font-size="52" font-weight="900" fill="#dc2626" text-anchor="middle">中</text>
    </g>
    <g transform="translate(165, 45)">
      <!-- Tile 2 Golden -->
      <rect x="0" y="10" width="85" height="120" rx="12" fill="url(#goldTile)" stroke="#fef08a" stroke-width="3"/>
      <text x="42" y="80" font-family="SimHei, serif" font-size="55" font-weight="900" fill="#14532d" text-anchor="middle">發</text>
      <span class="text-xs">x5 MULTIPLIER</span>
    </g>
    <!-- Title Banner -->
    <g transform="translate(15, 230)">
      <rect width="290" height="70" rx="14" fill="#09090b" opacity="0.94" stroke="#10b981" stroke-width="2"/>
      <text x="145" y="30" font-family="Arial Black, Impact, sans-serif" font-size="20" font-weight="900" fill="#34d399" text-anchor="middle" letter-spacing="1">MAHJONG WAYS 2</text>
      <text x="145" y="52" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fde047" text-anchor="middle" letter-spacing="2">PG SOFT • RTP 96.95%</text>
    </g>
  </svg>