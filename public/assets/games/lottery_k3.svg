<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="mintBgK3" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e8f8f0" />
      <stop offset="100%" stop-color="#cbf3dd" />
    </radialGradient>
    <filter id="diceDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#047857" flood-opacity="0.25" />
    </filter>
    <filter id="floorBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
    <linearGradient id="whiteDieTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="whiteDieLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="whiteDieRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="200" height="200" rx="20" fill="url(#mintBgK3)" />

  <!-- Diagonal subtle pattern stripes -->
  <path d="M-20,60 L120,-80 M-20,120 L180,-80 M-20,180 L240,-80 M40,220 L260,0 M100,240 L280,60" 
        stroke="#10b981" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Floor Shadows -->
  <ellipse cx="60" cy="158" rx="28" ry="8" fill="#047857" opacity="0.25" filter="url(#floorBlur)" />
  <ellipse cx="120" cy="168" rx="35" ry="9" fill="#047857" opacity="0.28" filter="url(#floorBlur)" />
  <ellipse cx="150" cy="148" rx="25" ry="7" fill="#047857" opacity="0.2" filter="url(#floorBlur)" />

  <!-- Die 1: Left Die (Isometric tilt) -->
  <g transform="translate(32, 75)" filter="url(#diceDrop)">
    <!-- Top Face -->
    <path d="M26,4 L48,16 L26,28 L4,16 Z" fill="url(#whiteDieTop)" stroke="#cbd5e1" stroke-width="1" />
    <!-- Left Face -->
    <path d="M4,16 L26,28 L26,54 L4,42 Z" fill="url(#whiteDieLeft)" stroke="#94a3b8" stroke-width="1" />
    <!-- Right Face -->
    <path d="M26,28 L48,16 L48,42 L26,54 Z" fill="url(#whiteDieRight)" stroke="#94a3b8" stroke-width="1" />
    <!-- Red Pips on Left Face (showing 2) -->
    <circle cx="12" cy="28" r="3.5" fill="#ef4444" />
    <circle cx="18" cy="42" r="3.5" fill="#ef4444" />
    <!-- Red Pip on Top (showing 1) -->
    <circle cx="26" cy="16" r="4" fill="#dc2626" />
    <!-- Red Pips on Right (showing 3) -->
    <circle cx="34" cy="28" r="3" fill="#ef4444" />
    <circle cx="37" cy="35" r="3" fill="#ef4444" />
    <circle cx="40" cy="42" r="3" fill="#ef4444" />
  </g>

  <!-- Die 2: Front Center Large Die (Showing 1 Red Pip on Top Face) -->
  <g transform="translate(90, 85)" filter="url(#diceDrop)">
    <!-- Top Face -->
    <path d="M34,4 L62,20 L34,36 L6,20 Z" fill="url(#whiteDieTop)" stroke="#cbd5e1" stroke-width="1.2" />
    <!-- Left Face -->
    <path d="M6,20 L34,36 L34,70 L6,54 Z" fill="url(#whiteDieLeft)" stroke="#94a3b8" stroke-width="1.2" />
    <!-- Right Face -->
    <path d="M34,36 L62,20 L62,54 L34,70 Z" fill="url(#whiteDieRight)" stroke="#94a3b8" stroke-width="1.2" />
    <!-- Big Red Pip on Top (Die 1) -->
    <circle cx="34" cy="20" r="6.5" fill="#dc2626" />
    <!-- Left Face (showing 4 red pips) -->
    <circle cx="15" cy="33" r="3.5" fill="#ef4444" />
    <circle cx="25" cy="39" r="3.5" fill="#ef4444" />
    <circle cx="15" cy="51" r="3.5" fill="#ef4444" />
    <circle cx="25" cy="57" r="3.5" fill="#ef4444" />
    <!-- Right Face (showing 5 red pips) -->
    <circle cx="43" cy="39" r="3.2" fill="#ef4444" />
    <circle cx="53" cy="33" r="3.2" fill="#ef4444" />
    <circle cx="48" cy="48" r="3.2" fill="#ef4444" />
    <circle cx="43" cy="57" r="3.2" fill="#ef4444" />
    <circle cx="53" cy="51" r="3.2" fill="#ef4444" />
  </g>

  <!-- Die 3: Right Back Die -->
  <g transform="translate(130, 85)" filter="url(#diceDrop)">
    <!-- Top Face -->
    <path d="M24,4 L44,15 L24,26 L4,15 Z" fill="url(#whiteDieTop)" stroke="#cbd5e1" stroke-width="1" />
    <!-- Left Face -->
    <path d="M4,15 L24,26 L24,50 L4,39 Z" fill="url(#whiteDieLeft)" stroke="#94a3b8" stroke-width="1" />
    <!-- Right Face -->
    <path d="M24,26 L44,15 L44,39 L24,50 Z" fill="url(#whiteDieRight)" stroke="#94a3b8" stroke-width="1" />
    <!-- Top Face Pips (6) -->
    <circle cx="16" cy="11" r="2.5" fill="#ef4444" />
    <circle cx="24" cy="15" r="2.5" fill="#ef4444" />
    <circle cx="32" cy="19" r="2.5" fill="#ef4444" />
    <!-- Left Face Red Pips -->
    <circle cx="14" cy="30" r="3" fill="#ef4444" />
    <circle cx="14" cy="42" r="3" fill="#ef4444" />
  </g>
</svg>
