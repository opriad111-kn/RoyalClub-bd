<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="goldFeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bgGrad)" />
  <circle cx="200" cy="110" r="130" fill="url(#sunGlow)" />

  <!-- Aztec Pyramid Silhouette in Background -->
  <polygon points="200,40 280,160 120,160" fill="#291403" opacity="0.6" />
  <polygon points="200,60 250,160 150,160" fill="#451a03" opacity="0.8" />

  <!-- Sun Disc Behind Head -->
  <circle cx="200" cy="130" r="75" fill="url(#goldFeather)" stroke="#fef08a" stroke-width="4" />
  <circle cx="200" cy="130" r="60" fill="#78350f" />

  <!-- Aztec Warrior / Emperor Face & Crown -->
  <!-- Feathers fan -->
  <path d="M140,80 Q200,20 260,80 Q200,60 140,80 Z" fill="url(#goldFeather)" />
  <path d="M120,110 Q200,30 280,110 Q200,80 120,110 Z" fill="#065f46" />
  <path d="M160,50 L200,10 L240,50 Z" fill="#dc2626" />
  <path d="M180,40 L200,5 L220,40 Z" fill="#fbbf24" />

  <!-- Golden Crown Band -->
  <rect x="155" y="90" width="90" height="25" rx="4" fill="url(#goldFeather)" stroke="#fff" stroke-width="1.5" />
  <circle cx="200" cy="102" r="6" fill="#0284c7" stroke="#fff" stroke-width="1" />
  <circle cx="175" cy="102" r="4" fill="#dc2626" />
  <circle cx="225" cy="102" r="4" fill="#dc2626" />

  <!-- Face -->
  <polygon points="170,115 230,115 220,195 200,215 180,195" fill="#d97706" />
  <!-- War Paint -->
  <rect x="175" y="145" width="50" height="5" fill="#dc2626" />
  <rect x="178" y="155" width="44" height="4" fill="#dc2626" />
  <!-- Eyes -->
  <ellipse cx="185" cy="140" rx="6" ry="3" fill="#fff" />
  <circle cx="185" cy="140" r="2" fill="#000" />
  <ellipse cx="215" cy="140" rx="6" ry="3" fill="#fff" />
  <circle cx="215" cy="140" r="2" fill="#000" />
  <!-- Nose & Mouth -->
  <polygon points="200,140 195,165 205,165" fill="#b45309" />
  <line x1="190" y1="180" x2="210" y2="180" stroke="#78350f" stroke-width="3" stroke-linecap="round" />

  <!-- Golden Armor Collar -->
  <path d="M140,210 Q200,240 260,210 L275,300 L125,300 Z" fill="url(#goldFeather)" stroke="#78350f" stroke-width="2" />
  <circle cx="200" cy="245" r="14" fill="#0284c7" stroke="#fff" stroke-width="2" />

  <!-- Title Ribbon -->
  <rect x="30" y="240" width="340" height="48" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="2" />
  <text x="200" y="272" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#fef08a" text-anchor="middle" letter-spacing="2">GOLDEN EMPIRE</text>
</svg>
