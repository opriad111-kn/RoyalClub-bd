<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="mintBg5d" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e8f8f0" />
      <stop offset="100%" stop-color="#cbf3dd" />
    </radialGradient>
    <radialGradient id="planetBall" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="75%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>
    <radialGradient id="purpleBall" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="40%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#581c87" />
    </radialGradient>
    <radialGradient id="pinkBall" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="40%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#047857" flood-opacity="0.25" />
    </filter>
    <filter id="floorBlur5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="200" height="200" rx="20" fill="url(#mintBg5d)" />

  <!-- Diagonal subtle pattern stripes -->
  <path d="M-20,60 L120,-80 M-20,120 L180,-80 M-20,180 L240,-80 M40,220 L260,0 M100,240 L280,60" 
        stroke="#10b981" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Floor Shadow -->
  <ellipse cx="115" cy="165" rx="45" ry="10" fill="#047857" opacity="0.2" filter="url(#floorBlur5)" />
  <ellipse cx="55" cy="162" rx="20" ry="6" fill="#047857" opacity="0.2" filter="url(#floorBlur5)" />

  <!-- Back part of ring -->
  <g transform="translate(115, 115) rotate(-18)">
    <ellipse cx="0" cy="0" rx="60" ry="15" fill="none" stroke="url(#ringGrad)" stroke-width="7" opacity="0.7" />
  </g>

  <!-- Center 5D Green Planet Ball -->
  <g filter="url(#softShadow)">
    <circle cx="115" cy="115" r="38" fill="url(#planetBall)" />
    <!-- Center 5D Text -->
    <text x="115" y="123" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">5D</text>
  </g>

  <!-- Front part of planetary ring (overlapping front of sphere) -->
  <g transform="translate(115, 115) rotate(-18)">
    <path d="M -60,0 A 60 15 0 0 0 60,0" fill="none" stroke="url(#ringGrad)" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Small Purple Ball "5" (Top Left Orbit) -->
  <g filter="url(#softShadow)">
    <circle cx="100" cy="50" r="16" fill="url(#purpleBall)" />
    <circle cx="100" cy="50" r="8" fill="#ffffff" />
    <text x="100" y="54" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#6b21a8" text-anchor="middle">5</text>
  </g>

  <!-- Small Pink Ball "D" (Bottom Left) -->
  <g filter="url(#softShadow)">
    <circle cx="55" cy="140" r="18" fill="url(#pinkBall)" />
    <circle cx="55" cy="140" r="9" fill="#ffffff" />
    <text x="55" y="144" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#be123c" text-anchor="middle">D</text>
  </g>
</svg>

