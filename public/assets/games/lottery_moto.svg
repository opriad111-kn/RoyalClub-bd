<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="mintBgMoto" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e8f8f0" />
      <stop offset="100%" stop-color="#cbf3dd" />
    </radialGradient>
    <linearGradient id="motoBikeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <filter id="motoDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#047857" flood-opacity="0.3" />
    </filter>
    <filter id="floorBlurMoto" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="200" height="200" rx="20" fill="url(#mintBgMoto)" />

  <!-- Diagonal subtle pattern stripes -->
  <path d="M-20,60 L120,-80 M-20,120 L180,-80 M-20,180 L240,-80 M40,220 L260,0 M100,240 L280,60" 
        stroke="#10b981" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Floor Shadow -->
  <ellipse cx="105" cy="168" rx="55" ry="9" fill="#047857" opacity="0.25" filter="url(#floorBlurMoto)" />

  <!-- Racing Motorcycle + Rider (leaning forward in speed pose) -->
  <g transform="translate(30, 45)" filter="url(#motoDrop)">
    
    <!-- Rear Wheel -->
    <circle cx="28" cy="95" r="22" fill="#1e293b" stroke="#64748b" stroke-width="4" />
    <circle cx="28" cy="95" r="14" fill="#0f172a" />
    <circle cx="28" cy="95" r="5" fill="#e2e8f0" />

    <!-- Front Wheel -->
    <circle cx="118" cy="92" r="22" fill="#1e293b" stroke="#64748b" stroke-width="4" />
    <circle cx="118" cy="92" r="14" fill="#0f172a" />
    <circle cx="118" cy="92" r="5" fill="#e2e8f0" />

    <!-- Bike Frame & Body -->
    <path d="M28,95 L65,72 L95,65 L118,92 L85,92 L60,95 Z" fill="url(#motoBikeGrad)" />
    <!-- Fairing / Gas Tank -->
    <path d="M60,65 Q80,50 100,62 L90,75 L55,75 Z" fill="#ea580c" />
    <!-- Exhaust Pipe (Chrome) -->
    <path d="M48,90 L22,98 L20,94 L45,86 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1" />

    <!-- Rider Legs / Leathers -->
    <path d="M48,68 L60,82 L72,82 L65,70 Z" fill="#1e293b" />
    <!-- Rider Torso (leaning low) -->
    <path d="M45,55 L78,50 L85,62 L52,65 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <!-- Rider Arm on Handlebars -->
    <path d="M72,55 L95,62" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <!-- Helmet (Glossy Orange & Black Visor) -->
    <circle cx="78" cy="38" r="14" fill="#f97316" />
    <!-- Visor -->
    <path d="M82,34 Q92,38 88,44 L80,44 Z" fill="#0f172a" />
    <ellipse cx="76" cy="32" rx="5" ry="3" fill="#fdba74" opacity="0.8" />
  </g>

  <!-- Number 1 Racing Coin / Badge -->
  <g transform="translate(142, 132)" filter="url(#motoDrop)">
    <circle cx="16" cy="16" r="16" fill="#10b981" stroke="#ffffff" stroke-width="2" />
    <text x="16" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
  </g>
</svg>

