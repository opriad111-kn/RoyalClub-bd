<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="50%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#180404"/>
    </linearGradient>
    <radialGradient id="ringLight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldBelt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bkBg)"/>
  <rect width="400" height="300" fill="url(#ringLight)"/>

  <!-- Ring Ropes -->
  <line x1="0" y1="180" x2="400" y2="180" stroke="#ef4444" stroke-width="4" stroke-dasharray="8,4" opacity="0.6"/>
  <line x1="0" y1="210" x2="400" y2="210" stroke="#f59e0b" stroke-width="4" opacity="0.7"/>
  <line x1="0" y1="240" x2="400" y2="240" stroke="#3b82f6" stroke-width="4" opacity="0.5"/>

  <!-- Boxing Gloves Clashing -->
  <g transform="translate(140, 95)" filter="url(#shadowGlow)">
    <!-- Left Red Glove -->
    <ellipse cx="25" cy="45" rx="35" ry="30" fill="#dc2626" transform="rotate(-25 25 45)"/>
    <ellipse cx="48" cy="35" rx="16" ry="12" fill="#ef4444" transform="rotate(-15 48 35)"/>
    <rect x="0" y="55" width="28" height="22" rx="4" fill="#991b1b" transform="rotate(-25 14 66)"/>
    <path d="M 5 62 L 25 72" stroke="#fff" stroke-width="2"/>
    <path d="M 8 68 L 22 75" stroke="#fff" stroke-width="2"/>
    
    <!-- Right Gold Glove -->
    <ellipse cx="95" cy="45" rx="35" ry="30" fill="#eab308" transform="rotate(25 95 45)"/>
    <ellipse cx="72" cy="35" rx="16" ry="12" fill="#fde047" transform="rotate(15 72 35)"/>
    <rect x="92" y="55" width="28" height="22" rx="4" fill="#ca8a04" transform="rotate(25 106 66)"/>
    <path d="M 95 62 L 115 72" stroke="#fff" stroke-width="2"/>
    <path d="M 98 68 L 112 75" stroke="#fff" stroke-width="2"/>

    <!-- Clash Spark -->
    <circle cx="60" cy="40" r="14" fill="#fff" opacity="0.9"/>
    <polygon points="60,15 65,35 85,40 65,45 60,65 55,45 35,40 55,35" fill="#fef08a"/>
  </g>

  <!-- Championship Belt Ribbon -->
  <g transform="translate(90, 195)">
    <rect x="0" y="10" width="220" height="34" rx="8" fill="#1c1917" stroke="#eab308" stroke-width="3"/>
    <!-- Gold Medallion Center -->
    <circle cx="110" cy="27" r="28" fill="url(#goldBelt)" stroke="#fff" stroke-width="2" filter="url(#shadowGlow)"/>
    <circle cx="110" cy="27" r="20" fill="#78350f"/>
    <!-- Crown Inside Belt -->
    <path d="M 100 32 L 100 24 L 105 28 L 110 20 L 115 28 L 120 24 L 120 32 Z" fill="#fef08a"/>
    <!-- Stars on Belt -->
    <text x="50" y="32" fill="#fef08a" font-size="14" font-weight="bold">★ ★</text>
    <text x="145" y="32" fill="#fef08a" font-size="14" font-weight="bold">★ ★</text>
  </g>

  <!-- JILI Badge Top Right -->
  <rect x="325" y="15" width="60" height="24" rx="6" fill="#dc2626" stroke="#fff" stroke-width="1.5"/>
  <text x="355" y="32" fill="#fff" font-family="Arial, sans-serif" font-weight="900" font-size="13" text-anchor="middle">JILI</text>

  <!-- Title Banner -->
  <g transform="translate(200, 268)">
    <rect x="-130" y="-18" width="260" height="34" rx="8" fill="#000" opacity="0.85" stroke="#eab308" stroke-width="1.5"/>
    <text x="0" y="6" fill="#fef08a" font-family="'Impact', Arial Black, sans-serif" font-weight="900" font-size="20" text-anchor="middle" letter-spacing="2">
      BOXING KING
    </text>
  </g>
</svg>
