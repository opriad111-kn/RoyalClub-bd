<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <radialGradient id="ringGold" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="85%" stop-color="#fef08a" />
      <stop offset="95%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
    <radialGradient id="casinoBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#01140e" />
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <circle cx="80" cy="80" r="76" fill="url(#ringGold)" />
  <circle cx="80" cy="80" r="66" fill="url(#casinoBg)" />

  <!-- 3D Casino Roulette & Poker Chips -->
  <!-- Back Playing Card -->
  <g transform="translate(62, 65) rotate(-20)" filter="url(#shadow)">
    <rect x="-18" y="-26" width="36" height="52" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="-12" y="-12" fill="#dc2626" font-family="'Arial Black'" font-size="10">A</text>
    <text x="0" y="8" fill="#dc2626" font-size="16" text-anchor="middle">♥</text>
  </g>

  <!-- Front Playing Card -->
  <g transform="translate(76, 60) rotate(15)" filter="url(#shadow)">
    <rect x="-18" y="-26" width="36" height="52" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="-12" y="-12" fill="#1e293b" font-family="'Arial Black'" font-size="10">A</text>
    <text x="0" y="8" fill="#1e293b" font-size="16" text-anchor="middle">♠</text>
  </g>

  <!-- Stacked Casino Poker Chips -->
  <!-- Chip 1 (Red) -->
  <g transform="translate(68, 102)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="22" fill="#dc2626" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 5" />
    <circle cx="0" cy="0" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
    <text x="0" y="4" fill="#ffffff" font-family="'Arial Black'" font-size="9" text-anchor="middle">100</text>
  </g>
  <!-- Chip 2 (Gold) -->
  <g transform="translate(98, 92)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="22" fill="#f59e0b" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 5" />
    <circle cx="0" cy="0" r="14" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5" />
    <text x="0" y="4" fill="#78350f" font-family="'Arial Black'" font-size="9" text-anchor="middle">500</text>
  </g>
</svg>