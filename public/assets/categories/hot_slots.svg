<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <radialGradient id="ringGold" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="85%" stop-color="#fef08a" />
      <stop offset="95%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
    <radialGradient id="innerBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="60%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Golden 3D Beveled Outer Ring -->
  <circle cx="80" cy="80" r="76" fill="url(#ringGold)" />
  <!-- Rich Inner Background -->
  <circle cx="80" cy="80" r="66" fill="url(#innerBg)" />

  <!-- 3 Slot Machine Reels -->
  <g transform="translate(80, 80)" filter="url(#shadow)">
    <!-- Slot Reel Case -->
    <rect x="-50" y="-32" width="100" height="64" rx="10" fill="#18181b" stroke="#f59e0b" stroke-width="2.5" />
    <line x1="-16" y1="-32" x2="-16" y2="32" stroke="#3f3f46" stroke-width="2" />
    <line x1="16" y1="-32" x2="16" y2="32" stroke="#3f3f46" stroke-width="2" />

    <!-- Lucky Triple 7s -->
    <text x="-33" y="15" fill="#fef08a" font-family="'Arial Black'" font-size="34" font-weight="900" text-anchor="middle">7</text>
    <text x="0" y="15" fill="#fef08a" font-family="'Arial Black'" font-size="34" font-weight="900" text-anchor="middle">7</text>
    <text x="33" y="15" fill="#fef08a" font-family="'Arial Black'" font-size="34" font-weight="900" text-anchor="middle">7</text>

    <!-- Payline Wire -->
    <line x1="-50" y1="2" x2="50" y2="2" stroke="#ef4444" stroke-width="2.5" opacity="0.8" />
  </g>

  <!-- Golden Coins Flying -->
  <circle cx="45" cy="42" r="9" fill="#fef08a" stroke="#b45309" stroke-width="1.5" />
  <circle cx="115" cy="40" r="10" fill="#fef08a" stroke="#b45309" stroke-width="1.5" />
  <circle cx="120" cy="115" r="9" fill="#fef08a" stroke="#b45309" stroke-width="1.5" />
</svg>