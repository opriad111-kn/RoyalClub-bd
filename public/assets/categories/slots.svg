<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <radialGradient id="ringGold" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="85%" stop-color="#fef08a" />
      <stop offset="95%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
    <radialGradient id="slotsBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="60%" stop-color="#1c0a00" />
      <stop offset="100%" stop-color="#0c0400" />
    </radialGradient>
    <linearGradient id="goldArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <circle cx="80" cy="80" r="76" fill="url(#ringGold)" />
  <circle cx="80" cy="80" r="66" fill="url(#slotsBg)" />

  <!-- 3D Spartan / Aztec Golden Warrior Helmet -->
  <g transform="translate(80, 82)" filter="url(#shadow)">
    <!-- Red Plume Crest -->
    <path d="M -35 -55 Q 0 -75 35 -55 Q 15 -35 0 -40 Q -15 -35 -35 -55 Z" fill="#dc2626" stroke="#991b1b" stroke-width="1.5" />
    
    <!-- Helmet Dome -->
    <path d="M -30 -35 Q 0 -55 30 -35 L 30 15 Q 0 30 -30 15 Z" fill="url(#goldArmor)" stroke="#78350f" stroke-width="2" />
    
    <!-- Face Shield & T-bar slit -->
    <rect x="-6" y="-20" width="12" height="32" fill="#000" rx="3" />
    <rect x="-24" y="-12" width="48" height="10" fill="#000" rx="3" />

    <!-- Ruby Jewel Center -->
    <circle cx="0" cy="-30" r="5" fill="#ef4444" stroke="#fff" stroke-width="1" />
  </g>

  <!-- Golden Stars & Sparkles -->
  <circle cx="45" cy="45" r="3" fill="#fff" />
  <circle cx="115" cy="45" r="3" fill="#fff" />
  <circle cx="45" cy="115" r="3" fill="#fff" />
  <circle cx="115" cy="115" r="3" fill="#fff" />
</svg>