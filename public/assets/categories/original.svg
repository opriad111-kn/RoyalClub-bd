<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <radialGradient id="ringGold" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="85%" stop-color="#fef08a" />
      <stop offset="95%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
    <radialGradient id="origBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="carRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="35%" stop-color="#ef4444" />
      <stop offset="80%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <circle cx="80" cy="80" r="76" fill="url(#ringGold)" />
  <circle cx="80" cy="80" r="66" fill="url(#origBg)" />

  <!-- Speed Motion Streaks -->
  <line x1="30" y1="65" x2="130" y2="65" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6" opacity="0.7" />
  <line x1="20" y1="95" x2="140" y2="95" stroke="#38bdf8" stroke-width="2" stroke-dasharray="12 8" opacity="0.7" />

  <!-- 3D Aerodynamic Red Sports Car / Jet -->
  <g transform="translate(80, 80) rotate(-12)" filter="url(#shadow)">
    <!-- Car Chassis Body -->
    <path d="M -45 5 Q -25 -15 15 -18 Q 45 -15 50 10 L -45 10 Z" fill="url(#carRed)" stroke="#7f1d1d" stroke-width="1.5" />
    
    <!-- Windshield -->
    <path d="M -10 -5 Q 5 -14 22 -14 L 20 -2 Q 5 -2 -10 -5 Z" fill="#38bdf8" stroke="#e0f2fe" stroke-width="1" />
    
    <!-- Wheels -->
    <circle cx="-25" cy="12" r="10" fill="#0f172a" stroke="#ca8a04" stroke-width="2" />
    <circle cx="-25" cy="12" r="4" fill="#ffffff" />
    <circle cx="32" cy="12" r="10" fill="#0f172a" stroke="#ca8a04" stroke-width="2" />
    <circle cx="32" cy="12" r="4" fill="#ffffff" />

    <!-- Rear Spoiler Wing -->
    <path d="M -48 2 L -42 -12 L -34 -12 L -38 2 Z" fill="#dc2626" />
  </g>
</svg>