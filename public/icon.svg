<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6" />
  
  <!-- Crown Icon -->
  <g transform="translate(96, 110)" filter="url(#glow)">
    <path d="M 20 220 L 50 80 L 110 150 L 160 30 L 210 150 L 270 80 L 300 220 Z" fill="url(#goldGrad)" />
    <!-- Jewels on crown tips -->
    <circle cx="50" cy="80" r="14" fill="#34d399" />
    <circle cx="160" cy="30" r="18" fill="#ef4444" />
    <circle cx="270" cy="80" r="14" fill="#34d399" />
    <!-- Crown Base -->
    <rect x="20" y="215" width="280" height="30" rx="8" fill="#ca8a04" />
    <circle cx="70" cy="230" r="8" fill="#38bdf8" />
    <circle cx="160" cy="230" r="9" fill="#ef4444" />
    <circle cx="250" cy="230" r="8" fill="#38bdf8" />
  </g>
  
  <!-- Brand Text -->
  <text x="256" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">ROYALCLUB BD</text>
  <text x="256" y="460" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" fill="#34d399" text-anchor="middle" letter-spacing="4">OFFICIAL APP</text>
</svg>

